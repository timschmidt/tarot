# Installed by tarot. Remove the package to restore the distribution default.
#
# A greeter session started by greetd (such as Phrog) launches its own user
# services: PulseAudio, feedbackd, a session bus, a keyring. They daemonize and
# would otherwise keep running as the greetd user after login. A leftover
# PulseAudio holds BlueZ's hands-free profile, so a headset's HFP mode and
# microphone go to the greeter's sound server instead of the user's. When the
# greeter's session ends at login, elogind now ends its remaining processes.
# Only the greetd user is affected. elogind reads this at startup: reboot after
# installing or removing.
[Login]
KillUserProcesses=yes
KillOnlyUsers=greetd
