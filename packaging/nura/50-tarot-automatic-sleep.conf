# Installed by tarot-automatic-sleep. Remove the package to restore the
# distribution's IdleAction=ignore.
#
# Tarot reports its session idle only after a protected screen-off, once the
# user's Automatic sleep setting and delay allow it. elogind then suspends when
# every session is idle and no idle block exists; sleep blocks from any user
# still apply. elogind 255.24 arms its idle timer only at startup: reboot (or
# restart elogind) after installing. After removal, a SIGHUP reload suffices.
[Login]
IdleAction=suspend
IdleActionSec=10s
