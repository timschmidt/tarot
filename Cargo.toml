[package]
name = "tarot"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true

[workspace]
members = ["crates/tarot-core", "crates/tarot-ui", "crates/tarot-keyboard", "crates/tarot-egui-probe", "crates/tarot-wayland-egui", "crates/tarot-lock"]
exclude = ["third-party/smithay"]
resolver = "2"

[patch.crates-io]
smithay = { path = "third-party/smithay" }

[workspace.package]
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
egui = "=0.33.3"
serde = { version = "1", features = ["derive"] }

[dependencies]
async-channel = "=2.5.0"
async-io = "=2.6.0"
async-trait = "=0.1.92"
futures-core = "=0.3.34"
wayland-scanner = "=0.31.11"
wayland-backend = "=0.3.17"
anyhow = "1"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
egui.workspace = true
egui_glow = "=0.33.3"
glow = "=0.16.0"
libpulse-sys = "=1.23.0"
libc = "0.2"
freedesktop-desktop-entry = { version = "=0.8.4", default-features = false }
png = "0.18"
resvg = { version = "=0.48.1", default-features = false, features = ["text"] }
rustix = { version = "1", features = ["process", "fs", "time", "net"] }
serde.workspace = true
serde_json = "1"
tempfile = "3"
toml = "=1.1.8"
smithay = { version = "=0.7.0", default-features = false, features = ["backend_winit", "wayland_frontend", "desktop", "renderer_glow"] }
tarot-core = { path = "crates/tarot-core" }
tarot-ui = { path = "crates/tarot-ui" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
xkbcommon = "=0.8.0"
zbus = "=5.16.0"
zeroize = "=1.8.2"

[profile.release]
lto = "thin"
codegen-units = 1

[dev-dependencies]
tarot-wayland-egui = { path = "crates/tarot-wayland-egui" }
wayland-client = { version = "=0.31.15", features = ["system"] }
wayland-protocols = { version = "=0.32.13", features = ["client", "staging"] }
wayland-protocols-misc = { version = "=0.3.12", features = ["client"] }
wayland-protocols-wlr = { version = "=0.3.12", features = ["client"] }

[features]
default = []
drm = ["smithay/backend_drm", "smithay/backend_gbm", "smithay/backend_libinput", "smithay/backend_session_libseat", "smithay/backend_udev"]

[[bin]]
name = "tarot"
path = "src/main.rs"

[[bin]]
name = "tarot-session"
path = "src/bin/session.rs"

[[bin]]
name = "tarot-boot-destination"
path = "src/bin/boot_destination.rs"

[[bin]]
name = "tarot-sleep-policy"
path = "src/bin/sleep_policy.rs"

[[bin]]
name = "tarot-usb-sleep-hook"
path = "src/bin/usb_sleep_hook.rs"
