 fill="#628CA0" /><text x="24" y="227" font-family="Lato" font-size="18" font-weight="bold" fill="#2D3933" text-anchor="start" >Jun Park</text><text x="345" y="226" font-family="Lato" font-size="12" font-weight="normal" fill="#58674F" text-anchor="end" >8:52</text><text x="24" y="249" font-family="Lato" font-size="16" font-weight="bold" fill="#435247" text-anchor="start" >Photos from the coast</text><text x="24" y="268" font-family="Lato" font-size="13.4" font-weight="normal" fill="#58674F" text-anchor="start" >I finally sorted the pictures from our trip.</text><rect x="0" y="278" width="360" height="73" rx="0" fill="url(#row)" /><path d="M0 350 L360 350" stroke="#C4CCC0" stroke-width="0.8" fill="none" /><text x="24" y="300" font-family="Lato" font-size="18" font-weight="normal" fill="#2D3933" text-anchor="start" >The Bookshop</text><text x="345" y="299" font-family="Lato" font-size="12" font-weight="normal" fill="#58674F" text-anchor="end" >8:10</text><text x="24" y="322" font-family="Lato" font-size="16" font-weight="normal" fill="#435247" text-anchor="start" >Your order is ready</text><text x="24" y="341" font-family="Lato" font-size="13.4" font-weight="normal" fill="#58674F" text-anchor="start" >Your books are waiting at the front desk.</text><rect x="0" y="351" width="360" height="73" rx="0" fill="url(#row)" /><path d="M0 423 L360 423" stroke="#C4CCC0" stroke-width="0.8" fill="none" /><text x="24" y="373" font-family="Lato" font-size="18" font-weight="normal" fill="#2D3933" text-anchor="start" >Daniel Moore</text><text x="345" y="372" font-family="Lato" font-size="12" font-weight="normal" fill="#58674F" text-anchor="end" >7:46</text><text x="24" y="395" font-family="Lato" font-size="16" font-weight="normal" fill="#435247" text-anchor="start" >Dinner on Friday</text><text x="24" y="414" font-family="Lato" font-size="13.4" font-weight="normal" fill="#58674F" text-anchor="start" >I booked a table for six. See you there.</text><rect x="0" y="424" width="360" height="73" rx="0" fill="url(#row)" /><path d="M0 496 L360 496" stroke="#C4CCC0" stroke-width="0.8" fill="none" /><text x="24" y="446" font-family="Lato" font-size="18" font-weight="normal" fill="#2D3933" text-anchor="start" >Mara Ellis</text><text x="345" y="445" font-family="Lato" font-size="12" font-weight="normal" fill="#58674F" text-anchor="end" >Yesterday</text><text x="24" y="468" font-family="Lato" font-size="16" font-weight="normal" fill="#435247" text-anchor="start" >A little list</text><text x="24" y="487" font-family="Lato" font-size="13.4" font-weight="normal" fill="#58674F" text-anchor="start" >Tea, bread, lemons, and something sweet.</text><rect x="0" y="564" width="360" height="56" rx="0" fill="url(#chrome)" /><path d="M0 564 L360 564" stroke="#9FA69F" stroke-width="1" fill="none" /><rect x="118" y="572" width="124" height="39" rx="18" fill="url(#dark)" stroke="#BCC5BA" stroke-width="0.7" /><g transform="translate(134 580) scale(0.875)" fill="none" stroke="#DDE7D8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M20 8A9 9 0 1 0 20 17M20 3v6h-6"/></g><path d="M178 574 L178 608" stroke="#151C1C" stroke-width="0.8" fill="none" /><g transform="translate(199 580) scale(0.875)" fill="none" stroke="#DDE7D8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="m4 16 12-13 5 5L8 21l-6 1ZM14 5l5 5"/></g></g><g fill="#030505"><path d="M0 32H11Q0 32 0 43Z"/><path d="M360 32H349Q360 32 360 43Z"/><path d="M0 652H11Q0 652 0 641Z"/><path d="M360 652H349Q360 652 360 641Z"/></g><rect x="0" y="652" width="360" height="32" rx="0" fill="#101719" /><g transform="translate(5 654) scale(0.421875)" filter="url(#iconShadow)"><path d="M5 10q28-9 54 0v31q-7 5-19 5L27 58l1-12Q12 47 5 41Z" fill="url(#green)" stroke="#52733B"/><path d="M12 14q20-6 40 0" stroke="#EEF8D3" stroke-width="2" fill="none"/><text x="32" y="35" font-family="Lato" font-size="28" font-weight="bold" fill="#F5F9E4" text-anchor="middle" >···</text></g><text x="40" y="6